[build-system]
requires = ["setuptools>=61.0", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "DINGO"
dynamic = ["version"]
description = "Dispersion-based INference for Galaxy Observations using R+C Grism Data"
authors = [
  {name = "Yichen Liu", email = "yichenliu@arizona.edu"}
]
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
# 3.12 is a hard floor, not a preference: fitting.py uses nested same-quote
# f-strings (e.g. :501, :538, :636, :1690), which are a syntax error before 3.12.
dependencies = [
  "numpy",
  "torch",
  "astropy",
  "matplotlib",
  "scipy",
  "pyyaml",
]

[project.optional-dependencies]
# emcee and corner are imported lazily, each behind its own fallback
# (fitting._import_emcee, plot._corner_fallback), so the gradient-fitting path
# works without them. They are required for fit_MCMC and the corner plots.
mcmc = ["emcee", "corner", "tqdm"]
native-posterior = ["jax>=0.4.30", "numpyro>=0.15", "arviz-stats>=1.0"]
real-notebook = ["jax>=0.4.30", "numpyro>=0.15", "arviz-stats>=1.0", "pysersic",
                 "pandas", "ipywidgets", "ipykernel", "nbformat", "nbclient", "corner"]
# Native R+C rotation notebook, including F150W inclination-prior fitting.
rotation = ["jax>=0.4.30", "numpyro>=0.22", "arviz-stats>=1.0", "corner",
            "pysersic", "pandas", "ipykernel", "ipywidgets", "tqdm", "nbformat", "nbclient"]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["dingo", "diagnostics"]
namespaces = true

[tool.setuptools_scm]
version_scheme = "no-guess-dev"
local_scheme = "node-and-date"

[tool.pytest.ini_options]
testpaths = ["tests"]
# `slow` marks the tests that build a real KinematicsFitter from staged FITS and
# run an Adam fit (~30 s each). Deselect with `-m "not slow"` for the fast suite.
markers = [
  "slow: needs staged data and a real fit",
]
