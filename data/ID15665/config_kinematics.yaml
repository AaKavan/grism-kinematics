# Generated by catalogs.make_config() -- regenerate rather than hand-edit the
# header, so RA/Dec/z always come from the EDR catalogue. ID15665 once carried
# ID3700's redshift because a config was copied by hand; that cannot happen here.

summary:
  name: ID15665
  ra: 64.007840
  dec: -24.148910
  z: 1.1613          # SAPPHIRES EDR zspec for ID15665
  lambda_rest: 1.875
  filter: F444W
  mode: kinematics
  r_fit: 40

# NOTE: no explicit `cutout:` here on purpose. The cutout position depends on z
# through lambda_rest*(1+z), so a hard-coded one goes stale the moment the
# redshift is corrected (it moved ~73 px for ID15665). Letting the r_fit
# fallback derive it keeps the two consistent by construction.

image:
  R:
    module: A
    path: ['ID15665/R.fits', 0]
    dx: 0
    dy: 0
  C:
    module: A
    path: ['ID15665/C.fits', 0]
    dx: 0
    dy: 0

velocity:
  model: arctan
  # The loss surface is multimodal -- do not "tidy" these. Under the old V_rot
  # parameterisation the (-300, 2, 1.2) sign-hint start reached loss()=0.142019 and
  # the (500, 3, 1.0) start reached 0.133961. Re-running that same start under the
  # V_sini parameterisation fell into a worse basin (0.4722): the reparameterisation
  # is exact in the model but it changes Adam's path. These values are the converged
  # V_rot+inclination-prior solution, carried over so the optimiser begins in the
  # right basin; V_sini = V_rot*sin(inc_v) = 618.4*sin(0.4563).
  V_sini: 272.5
  R_v: 4.6865
  x0_v: 41.7302
  y0_v: 41.8428
  theta_v: 2.3601
  inc_v: 0.4563

# ----------------------------------------------------------------------------
# Fitting strategy (also defines the free-parameter set that fit_MCMC samples)
# ----------------------------------------------------------------------------

fitting:
  - method: Adam
    maxiter: 2500
    scheduler: StepLR
    default:
      lr: 0.05
      min: -1e10
      max: 1e10
      fit: true
    override:
      image.R.dx, image.R.dy:
        lr: 0.5
      # The amplitude needs an lr matched to its SCALE, not the default.
      # Adam moves a parameter by ~lr per step whatever the gradient is, so at
      # the default 0.05 -- fine for theta_v (range 2pi) or R_v (~1) -- this one
      # travels ~98 km/s over the StepLR schedule, against a comb tooth spacing
      # of 75-95 and a plausible range of 0-2500. The fit then cannot leave the
      # tooth it started in and reports the starting guess back as a result.
      #
      # Measured on ID15665, five starts spanning 50-1100 km/s:
      #     lr 0.05 -> 134.8 203.2 361.7 689.8 1068.1   (spread 933 km/s)
      #     lr 5    -> 275.5 274.0 275.6 274.1  338.0   (spread  64 km/s)
      # against a published V_sini of 271.5. The rule of thumb is lr ~ range/500.
      #
      # This is what the grad student's `velocity.v_rot: {lr: 1}` was for. It was
      # lowercase, matched no parameter, and was a warning rather than an error;
      # check_unused_overrides now raises on it.
      velocity.V_sini:
        lr: 5
      # The C-grism offsets are FIXED. Shifting both grisms by the same amount
      # and moving (x0_v, y0_v) by the same amount translates the rectified
      # images together and leaves R-C unchanged, so (dx_R, dx_C, x0_v) and
      # (dy_R, dy_C, y0_v) each contain an exactly flat direction (the K=20
      # ensemble measured the common mode floating by ~1 px while R-C was pinned
      # to 0.09 px). Fixing C removes it: the R offsets carry the relative
      # registration and (x0_v, y0_v) the absolute one, in the C frame.
      image.C.dx, image.C.dy:
        fit: false
      velocity.theta_v:
        fit: true
      # R_v is a turnover RADIUS: without this floor Adam happily returns a
      # negative one (ID21619 gave -0.011), which is unphysical and then blocks
      # MCMC initialisation. The grad student's working batch sets the same bound.
      # Floored at 0.5, not 0: at exactly R_v = 0 the forward model is finite
      # (atan(r/0) = pi/2) but its gradient is 0*(-inf) = NaN, and NaN survives
      # everything downstream -- clamp_(min=0) leaves NaN as NaN, and the
      # railing check `v < lo or v > hi` is False for NaN, so a dead parameter
      # is reported as 0% railed. 0.5 also matches the MCMC prior floor below,
      # so `init: adam` cannot seed the walkers outside their own prior.
      velocity.R_v:
        min: 0.5
      # Under the V_sini parameterisation the amplitude no longer depends on
      # inclination -- only the weak cos(inc_v) deprojection does -- and Adam does
      # not see the MCMC priors. Left at [0, 1.57] the optimiser drives inc_v to
      # exactly 0 (face-on removes the deprojection entirely), which then falls
      # outside the prior support and no walker can initialise. Hold it within
      # +-2 sigma of the photometric value during optimisation; the MCMC samples it
      # under its Gaussian prior, which is what actually constrains it.
      velocity.inc_v:
        min: 0.3811
        max: 0.7291

  - method: Adam
    maxiter: 1500
    scheduler: ReduceLROnPlateau
    default:
      lr: 0.003
      min: -1e10
      max: 1e10
      fit: true
    override:
      velocity.theta_v:
        fit: false
      velocity.V_sini:
        lr: 0.3
      image.C.dx, image.C.dy:
        fit: false
      # NOTE: velocity.inc_v's [0.3811, 0.7291] clamp from stage 1 is INHERITED
      # here and no longer has to be repeated. It used to: stage 2 fell back to
      # the [-1e10, 1e10] default, which silently undid the stage-1 bound and let
      # inc_v rail to 0.0098. Bounds now carry forward; lr and fit stay per-stage.
      # A later stage can still widen a bound by naming it explicitly.

# ----------------------------------------------------------------------------
# MCMC posterior sampling (read only by fit_MCMC)
# ----------------------------------------------------------------------------

mcmc:
  vectorize: true      # batched likelihood: all walkers of a half-step in one model call
  nwalkers: 256
  # Stage 1 (index 0): stage 2 freezes theta_v for the polish, so sampling there
  # would silently drop it from the free set.
  stage: 0
  # `gaussian`: per-pixel variance and effective pixel count derived from the
  # rectification operator itself (see KinematicsFitter.setup_noise_model), with
  # a fitted noise scale ln_f as a check. `adam` reproduces the optimizer's
  # unweighted SSE with a flat fixed variance; its temperature is off by the
  # mean sum of squared bilinear weights (~0.44), and is kept only for comparison.
  likelihood: gaussian
  init: adam

  nsteps: 8000
  nburn: 2000
  xy_iters: 40
  xy_tol: 5e-3
  log_cadence: 200
  seed: 42
  checkpoint: ../results/ID15665/ID15665_chain_checkpoint.npz
  resume: true
  checkpoint_every: 500

  noise:
    fit_ln_f: true
    corr_area: auto

  init_scatter:
    velocity.V_sini:  2.0
    velocity.R_v:    0.05
    velocity.x0_v:   0.05
    velocity.y0_v:   0.05
    velocity.theta_v: 0.01
    velocity.inc_v:  0.01
    image.R.dx:      0.02
    image.R.dy:      0.02
    noise.ln_f:      0.05

  priors:
    # one-signed: (V_sini, theta_v) and (-V_sini, theta_v+pi) give an identical vz field
    velocity.V_sini:   {type: uniform,     min: 0.0,    max: 1500.0}   # projected amplitude; V_rot = V_sini/sin(inc_v) is derived
    # lower bound keeps the damped fixed-point iteration contracting; the upper
    # bound is the cutout radius: beyond it the arctangent is a solid-body field
    # of vanishing amplitude, i.e. a no-rotation model that the sampler can hide
    # in (the ID6084 chain did, at R_v -> 100 on a 41 px cutout).
    velocity.R_v:     {type: log_uniform, min: 0.5,    max: 40.0}
    # Centred on the cutout with a width that still admits an off-centre source:
    # ID6170's centre fits at y0 = 54.9, which a +-10 px window would exclude and
    # then fail at walker initialisation.
    velocity.x0_v:    {type: uniform,     min: 10.0, max: 70.0}
    velocity.y0_v:    {type: uniform,     min: 10.0, max: 70.0}
    velocity.theta_v: {type: uniform,     min: 0.0,    max: 6.283185}
    # Photometric inclination, written by geko_dingo_compare.set_inclination_prior()
    # from this source's own pysersic fit. This is the ONE informative prior DINGO
    # takes. It does not break the V--inc degeneracy (nothing in the data does);
    # sampling V_sini above is what removes that direction. Its width sets how well
    # the derived V_rot = V_sini/sin(inc_v) is known.
    velocity.inc_v:   {type: gaussian, mu: 0.5551, sigma: 0.0870, min: 0.0873, max: 1.4835}   # from ID15665_sersic_F444W_pysersic_fixedinc.npz
    image.R.dx:       {type: uniform,     min: -10.0,  max: 10.0}
    image.R.dy:       {type: uniform,     min: -10.0,  max: 10.0}
    noise.ln_f:       {type: uniform,     min: -1.5,   max: 1.5}
